
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusMarket</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-2">CampusMarket</h2>

                    <p class="text-center text-muted mb-4">
                        Welcome! Sign in or create your account.
                    </p>

                    <!-- LOGIN SECTION -->

                    <div id="loginSection">

                        <h4 class="mb-3">Student Login</h4>

                        <form id="loginForm">

                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="loginEmail"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                    class="form-control"
                                    id="loginPassword"
                                    required>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Login
                            </button>

                        </form>

                        <p class="text-center mt-3">
                            Don't have an account?
                            <a href="#" id="showSignup">Create Account</a>
                        </p>

                    </div>


                    <!-- REGISTRATION SECTION -->

                    <div id="signupSection" style="display: none;">

                        <h4 class="mb-3">Create Student Account</h4>

                        <form id="signupForm">

                            <div class="mb-3">
                                <label for="signupName" class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="signupName"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="signupEmail" class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="signupEmail"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="signupPassword" class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                    class="form-control"
                                    id="signupPassword"
                                    minlength="6"
                                    required>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Create Account
                            </button>

                        </form>

                        <p class="text-center mt-3">
                            Already have an account?
                            <a href="#" id="showLogin">Login</a>
                        </p>

                    </div>


                    <!-- AUTHENTICATION MESSAGE -->

                    <div id="authMessage" class="mt-3"></div>


                    <!-- LOGOUT BUTTON -->

                    <div class="mt-3">

                        <button id="logoutButton"
                            class="btn btn-danger w-100">
                            Logout
                        </button>

                    </div>


                    <!-- BACK TO MARKETPLACE -->

                    <div class="text-center mt-3">

                        <a href="index.html">
                            Back to Marketplace
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- SUPABASE CONNECTION -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

</body>
</html>
